<html lang="pt-AO"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MuiSav</title><meta name="theme-color" content="#16408A" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#12284F" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.json"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MuiSav"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: caderno de contas. Cabeçalho com a data de hoje, alertas de cobrança logo no primeiro ecrã, listas por baixo, navegação fixa em baixo. */
:root{
  --bg:#EDF1F0;
  --surface:#FFFFFF;
  --surface-2:#F4F7F6;
  --ink:#13201E;
  --muted:#566966;
  --line:#D3DCDA;
  --accent:#1D4F9E;
  --accent-ink:#FFFFFF;
  --accent-soft:#E1EAF7;
  --good:#17704A;
  --good-soft:#DDF0E5;
  --warn:#845400;
  --warn-soft:#FAEDCB;
  --bad:#B3261E;
  --bad-soft:#FAE2DF;
  --gold:#F2B632;
  --logo-2:#12356F;
  --brand:#16408A;
  --brand-2:#0F2F6B;
  --hi:#F9D648;
  --hi-ink:#2A2200;
  --scrim:rgba(8,16,15,.55);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1615;--surface:#162120;--surface-2:#1C2A28;--ink:#E5EEEC;--muted:#9AAFAB;--line:#2A3B39;
    --accent:#86AEF2;--accent-ink:#0B1A33;--accent-soft:#1B2B47;
    --good:#62C998;--good-soft:#14342A;--warn:#E7B64F;--warn-soft:#3A2E12;--bad:#F28B82;--bad-soft:#402120;--gold:#F2C14E;--logo-2:#4F7BCB;--brand:#1E4585;--brand-2:#12284F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1615;--surface:#162120;--surface-2:#1C2A28;--ink:#E5EEEC;--muted:#9AAFAB;--line:#2A3B39;
  --accent:#86AEF2;--accent-ink:#0B1A33;--accent-soft:#1B2B47;
  --good:#62C998;--good-soft:#14342A;--warn:#E7B64F;--warn-soft:#3A2E12;--bad:#F28B82;--bad-soft:#402120;--gold:#F2C14E;--logo-2:#4F7BCB;--brand:#1E4585;--brand-2:#12284F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px calc(88px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1;font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.small{font-size:13px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabeçalho */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px}
.top>div{min-width:0}

/* botões e etiquetas */
.btn{font:inherit;font-weight:500;font-size:14.5px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13.5px}
.btn[disabled]{opacity:.55;cursor:default}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.sec{display:grid;gap:10px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-weight:500;font-size:18px;margin-top:2px;overflow-wrap:anywhere}
.stat b.bad{color:var(--bad)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.group-h{display:flex;align-items:center;gap:8px;margin-top:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.acc{background:var(--accent)}
.al{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr) auto}
.al-main{min-width:0}
.al-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.al-val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;font-size:16px;text-align:right;align-self:start}
.al-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.row{display:grid;gap:6px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--muted)}
.row-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px}
.row-top strong{min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}
.bar.score>i{background:var(--accent)}
.empty{display:grid;gap:10px;justify-items:start;padding:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px}
.kv div{min-width:0}
.kv dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv dd{margin:2px 0 0;font-family:var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:540px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pay{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.crit{display:grid;gap:8px}
.crit label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.crit label.auto{cursor:default;background:var(--surface-2)}
.crit input{margin-top:3px;width:18px;height:18px}
.crit .w{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.notice.bad{background:var(--bad-soft);color:var(--bad)}

/* formulários */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],select,textarea{
  font:inherit;font-size:16px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:72px}
input:disabled{opacity:.6}
.hint{font-size:12.5px;color:var(--muted)}

/* ecrã sobreposto */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;background:var(--bg);width:100%;max-width:700px;max-height:94%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;border:1px solid var(--line)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media (min-width:720px){.sheet{align-items:center}.sheet-panel{border-radius:16px;max-height:90%}}

/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)}
.nav-in{max-width:980px;margin:0 auto;display:flex}
.nav button{flex:1;font:inherit;font-size:13.5px;font-weight:500;padding:13px 4px 11px;border:0;border-top:3px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}
.nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:var(--surface);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:var(--surface)}
/* refinamento: um bloco por assunto, mais espaço, textos que explicam */
body{font-size:16px;line-height:1.55}
.wrap{gap:36px}
.stack{display:grid;gap:44px;min-width:0}
.stack-sm{display:grid;gap:16px}
h2{font-size:23px;line-height:1.2}
h2.big{font-size:28px}
h3{font-size:18px}
.lead{color:var(--muted);font-size:15px}
.sec{gap:18px}
.sec-t{display:grid;gap:4px}
.grp{display:grid;gap:12px}
.grp+.grp{margin-top:14px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;min-width:0}
.block.empty{justify-items:start}
.card{border-radius:14px;padding:22px}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
.apart{padding-top:16px;border-top:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:58px;height:58px;flex:none;display:block}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em}
.brand-name b{color:var(--accent);font-weight:700}
.brand-sub{font-size:13px;color:var(--muted);margin-top:5px}
.top{align-items:center}
.top-r{display:grid;gap:6px;justify-items:start}
@media (min-width:640px){.top-r{justify-items:end;text-align:right}}
.stats{background:none;border:0;border-radius:0;overflow:visible;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:4px;align-content:start}
.stat b{font-size:24px;margin-top:4px}
.stat p{font-size:13.5px;color:var(--muted)}
.group-h h3{font-size:19px}
.count{min-width:24px;height:24px;padding:0 8px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.al{grid-template-columns:1fr;gap:14px;padding:18px;border-radius:14px}
.al-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.al-name{font-weight:600;font-size:18px;min-width:0;overflow-wrap:anywhere}
.al-val{font-size:22px}
.al-lines{display:grid;gap:6px;justify-items:start}
.al-act{padding-top:14px;border-top:1px solid var(--line);gap:8px}
.btn{min-height:44px;font-size:15px}
.btn.sm{min-height:42px;padding:8px 14px;font-size:14.5px}
.row{padding:16px 18px;gap:8px;border-radius:14px}
.kv{gap:20px 24px}
.kv dd{font-size:19px}
.items{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.item>span:first-child{min-width:0}
.fs{display:grid;gap:12px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.fs>.hint{margin-top:-6px}
.pay{padding:12px 14px}
.nav button{font-size:13.5px;padding:15px 2px 13px;white-space:nowrap;gap:4px}
@media (min-width:560px){.nav button{font-size:15px}}
.det{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.det summary{cursor:pointer;padding:16px 20px;font-weight:600;min-height:48px;display:flex;align-items:center;list-style:none}
.det summary::-webkit-details-marker{display:none}
.det summary::after{content:'+';margin-left:auto;font-size:20px;color:var(--muted)}
.det[open] summary::after{content:'\2212'}
.det[open] summary{border-bottom:1px solid var(--line)}
.det-b{padding:18px 20px;display:grid;gap:12px}
.notice{font-size:15px;padding:12px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* v2: faixa de marca, introdução, simulador, passos e condições */
body{padding-block:0 calc(88px + env(safe-area-inset-bottom,0px));padding-left:0;padding-right:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand-2);z-index:60}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{padding-block:24px 8px;box-sizing:content-box}
.topbar{background:var(--brand-2);color:#fff}
.bar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:14px;box-sizing:content-box}
.topbar .logo{width:44px;height:44px}
.bar-t{min-width:0}
.topbar .brand-name{font-size:26px;color:#fff}
.topbar .brand-name b{color:var(--hi)}
.topbar .brand-sub{color:rgba(255,255,255,.78);font-size:12px;margin-top:3px}
.store{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12.5px;color:rgba(255,255,255,.88);white-space:nowrap}
.sdot{width:9px;height:9px;border-radius:50%;background:#9FB4D8}
.sdot.good{background:#5BE0A3}.sdot.warn{background:var(--hi)}.sdot.bad{background:#FF8A80}
@media (max-width:480px){.brand-sub{display:none}.store{font-size:12px}}

.hero{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:28px 22px;display:grid;gap:18px;
  background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.12) 0 110px,transparent 111px),linear-gradient(140deg,var(--brand),var(--brand-2))}
.hero h1{font-size:clamp(30px,7.4vw,46px);line-height:1.06;letter-spacing:-.02em;color:#fff;font-weight:700}
.hero .hl{color:var(--hi)}
.hero-t{display:grid;gap:14px;align-content:start;min-width:0}
.hero-t>p:not(.eyebrow){color:rgba(255,255,255,.9);font-size:16px;max-width:46ch}
.hero .eyebrow{color:rgba(255,255,255,.72)}
.hero-art{width:100%;max-width:200px;justify-self:end;height:auto;display:block}
@media (min-width:720px){.hero{grid-template-columns:1.25fr .75fr;align-items:center;padding:40px}.hero-art{max-width:300px}}
.hero-t>p.hero-st{font-family:var(--f-display);font-weight:600;font-size:clamp(21px,4.8vw,28px);line-height:1.2;color:var(--hi);max-width:30ch}
.hero-t>p.hero-sub{font-size:15.5px}
.hero-t>p.hero-intro{font-size:14.5px;color:rgba(255,255,255,.82);border-top:1px solid rgba(255,255,255,.22);padding-top:14px;max-width:54ch}
.btn.gold{background:var(--hi);color:var(--hi-ink);border-color:var(--hi);font-weight:600}
.btn.gold:hover{border-color:#fff}
.btn.ghost-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn.ghost-w:hover{border-color:#fff}

.sec-c{display:grid;gap:8px;text-align:center;justify-items:center}
.sec-c h2{font-size:clamp(25px,5.4vw,32px);line-height:1.15;letter-spacing:-.015em}
.sec-c .lead{max-width:54ch}
.hl-b{color:var(--accent)}

.sim{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:22px 18px;display:grid;gap:18px;max-width:720px;width:100%;margin:0 auto}
.sim-box{border:1px solid var(--line);border-radius:18px;padding:16px 18px 14px;display:grid;gap:10px;background:var(--surface-2)}
.sim-l{font-size:14px;color:var(--muted);font-weight:500}
.sim-v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.01em}
.sim-mm{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;border:0;padding:0;margin:10px 0 4px;cursor:pointer;
  background:linear-gradient(to right,var(--accent) var(--pct,30%),var(--line) var(--pct,30%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:48px;height:30px;border-radius:15px;border:3px solid var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.3);

const pad=n=>String(n).padStart(2,'0');

function hojeISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addMeses(iso,k){const p=parse(iso);const t=(p.m-1)+k;const ny=p.y+Math.floor(t/12);const nm=((t%12)+12)%12;
  const dim=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();return ny+'-'+pad(nm+1)+'-'+pad(Math.min(p.d,dim))}
function addDias(iso,k){const t=new Date(utc(iso)+k*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())}
function fmt(iso){if(!iso)return '';const p=parse(iso);return pad(p.d)+'/'+pad(p.m)+'/'+p.y}

function plano(p){
  const P=p.capital,n=p.n,r=p.taxa/100;
  let exato,pmt;
  if(p.metodo==='price'&&r>0){pmt=P*r/(1-Math.pow(1+r,-n));exato=pmt*n}
  else{exato=P+P*r*n;pmt=exato/n}
  const pr=Math.round(pmt),total=Math.round(exato),lista=[];
  for(let k=1;k<=n;k++){lista.push({n:k,venc:addMeses(p.inicio,k),valor:k<n?pr:total-pr*(n-1)})}
  return{lista:lista,total:total,juros:total-P,pmt:pr};
}

function situacao(e,hoje,aviso){
  let pool=(e.pagamentos||[]).reduce((s,x)=>s+Number(x.valor||0),0);
  const linhas=(e.prestacoes||[]).map(p=>{
    const pago=Math.min(p.valor,pool);pool-=pago;

    return{n:p.n,venc:p.venc,valor:p.valor,pago:pago,saldo:saldo,estado:estado,dias:dias};

  const cfg=S.config;const itens=[];let pts=0,total=0;
  CRIT.forEach(c=>{

    if(c.id==='esforco'){
      const r=num(cl&&cl.rendimento);

  return{itens:itens,pts:pts,total:total,pct:pct,dec:dec};

    corpo='Olá '+nome+'. '+(al.qtd>1?'Estão em atraso '+al.qtd+' prestações, no total de '+kz(al.valor)+'. A mais antiga venceu em '+fmt(al.venc)+' (há '+dias+(dias===1?' dia':' dias')+').'
      :'Está em atraso a prestação '+al.ref+', de '+kz(al.valor)+', vencida em '+fmt(al.venc)+' (há '+dias+(dias===1?' dia':' dias')+').')
      +' Pode regularizar e enviar-nos o comprovativo? Obrigado.';
  }else if(al.grupo==='hoje'){
    corpo='Olá '+nome+'. Lembramos que a prestação '+al.ref+', de '+kz(al.valor)+', vence hoje ('+fmt(al.venc)+'). Obrigado.';
  }else{
    corpo='Olá '+nome+'. Lembramos que a prestação '+al.ref+', de '+kz(al.valor)+', vence em '+fmt(al.venc)+' (daqui a '+dias+(dias===1?' dia':' dias')+'). Obrigado.';
  }
  const c=S.config,dados=[];
  if(c.banco)dados.push('Banco: '+c.banco);
  if(c.titular)dados.push('Titular: '+c.titular);
  if(c.iban)dados.push('IBAN: '+c.iban);
  if(c.express)dados.push('Multicaixa Express: '+c.express);
  if(dados.length)corpo+='\n\nDados para pagamento:\n'+dados.join('\n');
  const neg=String(S.config.negocio||'MuiSav').trim();
  return neg?corpo+'\n— '+neg:corpo;
}

function simInput(t){
  if(!UI.sim)return;
  if(t.id==='sim-cap')UI.sim.capital=num(t.value);
  else if(t.id==='sim-prazo')UI.sim.prazo=Math.max(1,Math.round(num(t.value)));
  else UI.sim.taxa=Math.max(0,num(t.value));
  atualizarSim();
}

    const es=S.emprestimos.filter(e=>e.clienteId===c.id);

    const saldo=ativos.reduce((s,e)=>s+sit(e).saldo,0);

/* ---------- render ---------- */
function render(){
  derivar();
  const main=$('#main');
  const a=document.activeElement;
  const fid=a&&a.id&&main.contains(a)?a.id:null;
  let ss=null,se=null;if(fid&&a.selectionStart!=null){try{ss=a.selectionStart;se=a.selectionEnd}catch(_){}}
  const y=window.scrollY;
  const V={painel:vPainel,clientes:vClientes,emprestimos:vEmprestimos,emprestimo:vEmprestimo,aquisicoes:vAquisicoes,aquisicao:vAquisicao,apoio:vApoio,admin:vAdmin};
  main.innerHTML=S.modo==='login'?vLogin():S.modo==='cliente'?vCliente():S.modo==='config'?'<div class="card">Falta configurar o Supabase: edite SB_URL e SB_KEY no index.html.</div>':(V[UI.view]||vPainel)();
  if(UI.view==='apoio')atualizarSim();
  if(fid){const n=document.getElementById(fid);if(n){n.focus();try{if(ss!=null)n.setSelectionRange(ss,se)}catch(_){}}}
  window.scrollTo(0,y);
  document.querySelectorAll('[data-nav]').forEach(b=>{
    const k=b.dataset.nav,ativo=k===UI.view||(k==='emprestimos'&&UI.view==='emprestimo')||(k==='aquisicoes'&&UI.view==='aquisicao');
    if(b.closest('.nav')){if(ativo)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}
  });
  const n=prontoTudo()?alertas().concat(alertasAq()).filter(x=>x.grupo==='atraso'||x.grupo==='hoje').length:0;
  const bd=$('#navBadge');bd.hidden=!n;bd.textContent=n;
  const hj=$('#hoje');if(hj)hj.textContent=new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  {const nb=document.querySelector('.nav');if(nb)nb.style.display=(S.modo==='cliente'||S.modo==='login')?'none':''}
  const na=$('#navAdmin');if(na)na.hidden=!(PERFIL&&PERFIL.papel==='admin');
  infoArmazem();
  if(SB&&SES)carregarFotos();
}

/* ---------- ecrã sobreposto ---------- */
function abrirSheet(titulo,html){
  $('#sheetTitle').textContent=titulo;$('#sheetBody').innerHTML=html;$('#sheet').hidden=false;
  const f=$('#sheetBody').querySelector('input:not([type=hidden]),select,textarea,button');
  if(f&&f.tagName!=='BUTTON')setTimeout(()=>{try{f.focus({preventScroll:true})}catch(_){}},30);
}
function fecharSheet(){$('#sheet').hidden=true;$('#sheetBody').innerHTML='';UI.confirmFn=null}
function toast(t,mau){
  const el=$('#toast');el.textContent=t;el.className='toast'+(mau?' bad':'');el.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},mau?4500:2600);
}
function confirmar(titulo,texto,rotulo,fn){
  UI.confirmFn=fn;
  abrirSheet(titulo,'<div class="sec"><p>'+esc(texto)+'</p><div class="actions"><button type="button" class="btn bad" data-action="confirmar">'+esc(rotulo)+'</button><button type="button" class="btn" data-action="fechar">Cancelar</button></div></div>');

async function copiar(texto){
  try{await navigator.clipboard.writeText(texto);toast('Mensagem copiada');return}catch(e){}
  abrirSheet('Mensagem de cobrança','<div class="sec"><p class="small muted">Não foi possível copiar automaticamente. Seleccione o texto e copie.</p><textarea id="m-texto" readonly rows="6">'+esc(texto)+'</textarea></div>');

}

function lerEmp(){
  const g=i=>document.getElementById(i);
  const man={};CRIT.filter(c=>!c.auto).forEach(c=>{const el=g('k-'+c.id);man[c.id]=!!(el&&el.checked)});
  return{clienteId:g('e-cliente').value,capital:num(g('e-capital').value),taxa:num(g('e-taxa').value),n:Math.round(num(g('e-prazo').value)),metodo:g('e-metodo').value,inicio:g('e-inicio').value,estado:g('e-estado').value,notas:g('e-notas').value.trim(),criterios:man};
}
function empValido(d){return d.clienteId&&d.capital>0&&d.taxa>=0&&d.n>=1&&d.n<=60&&/^\d{4}-\d{2}-\d{2}$/.test(d.inicio)}
function atualizarPrev(){
  const form=$('#f-emp');if(!form)return;
  const d=lerEmp(),cl=cliente(d.clienteId),ok=empValido(d);
  const pl=ok?plano(d):null;
  const av=avaliar(cl,pl?pl.pmt:0,d.criterios,form.dataset.id||null);
  const cor=av.dec==='ok'?'good':av.dec==='rever'?'warn':'bad';
  const txt=av.dec==='ok'?'Sugestão: aprovar':av.dec==='rever'?'Sugestão: rever com cuidado':'Sugestão: não aprovar';
  $('#aval').innerHTML='<div class="sec-h"><span class="pill '+cor+'">'+esc(txt)+'</span><span class="mono">'+av.pct+'% · '+av.pts+'/'+av.total+' pontos</span></div><div class="bar score" aria-hidden="true"><i style="width:'+av.pct+'%"></i></div>'
    +'<div class="crit" style="margin-top:8px">'+av.itens.filter(i=>i.auto).map(i=>'<div class="crit"><label class="auto"><input type="checkbox" disabled'+(i.ok?' checked':'')+'><span>'+esc(i.label)+'<br><span class="hint">'+esc(i.nota)+'</span></span><span class="w">peso '+i.peso+'</span></label></div>').join('')+'</div>';
  if(!pl){$('#prev').innerHTML='<p class="small muted">Indique cliente, capital, prazo e data para ver as prestações.</p>';return}
  $('#prev').innerHTML='<p class="small muted">Prestação de <strong class="mono">'+kz(pl.pmt)+'</strong> · juros totais <span class="mono">'+kz(pl.juros)+'</span> · total a pagar <span class="mono">'+kz(pl.total)+'</span> · liquidação prevista em <strong class="mono">'+fmt(pl.lista[pl.lista.length-1].venc)+'</strong></p>'
    +'<div class="table-wrap"><table><thead><tr><th class="n">N.º</th><th>Vencimento</th><th class="n">Valor</th></tr></thead><tbody>'
    +pl.lista.map(l=>'<tr><td class="n">'+l.n+'</td><td>'+fmt(l.venc)+'</td><td class="n">'+kz(l.valor)+'</td></tr>').join('')+'</tbody></table></div>';
}

function importar(file){
  const r=new FileReader();
  r.onerror=()=>toast('Não foi possível ler o ficheiro.',true);
  r.onload=()=>{
    let o;
    try{o=JSON.parse(String(r.result).replace(/^\uFEFF/,''))}catch(e){toast('Ficheiro inválido.',true);return}
    if(!o||!Array.isArray(o.clientes)||!Array.isArray(o.emprestimos)||!Array.isArray(o.aquisicoes)){toast('Este ficheiro não é uma cópia do MuiSav.',true);return}
    confirmar('Restaurar cópia','Isto substitui TODOS os dados actuais pelos da cópia ('+o.clientes.length+' clientes, '+o.emprestimos.length+' empréstimos, '+o.aquisicoes.length+' créditos). Continuar?','Restaurar',async()=>{
      for(const col of ['emprestimos','aquisicoes','clientes'])for(const x of S[col].slice())await apagar(col,x.id);
      for(const col of ['clientes','emprestimos','aquisicoes'])for(const x of o[col])await salvar(col,x);
      if(o.config&&typeof o.config==='object')await salvarConfig(Object.assign({},DEF,o.config));
      toast('Cópia restaurada');
    });
  };
  r.readAsText(file);
}

  const lista=(S.meus||[]).map(x=>{const e=est[x.estado]||['—',''];return '<li class="card"><div class="row-top"><strong>'+esc(tipo[x.tipo]||x.tipo)+'</strong><span class="pill'+e[1]+'">'+e[0]+'</span></div><p class="small muted">'+kz(x.valor)+' · '+esc(x.prazo)+' meses · '+new Date(x.criado).toLocaleDateString('pt-PT')+'</p>'+(x.finalidade?'<p class="small">'+esc(x.finalidade)+'</p>':'')+'</li>'}).join('');
  return (S.erro?'<div class="notice bad">'+esc(S.erro)+'</div>':'')+'<section class="block"><h2>Olá'+(nome?', '+esc(nome):'')+'</h2><p class="small muted">Faça o seu pedido. O administrador analisa e responde.</p><form id="f-ped" class="sec"><label class="field"><span>Serviço</span><select id="q-tipo"><option value="concessao">Concessão de crédito</option><option value="aquisicao">Aquisição de crédito</option></select></label><label class="field"><span>Valor (Kz)</span><input type="number" id="q-val" min="1" step="any" inputmode="decimal" required></label><label class="field"><span>Prazo (meses, 1 a 60)</span><input type="number" id="q-prazo" min="1" max="60" inputmode="numeric" required></label><label class="field"><span>Telefone</span><input type="tel" id="q-tel" autocomplete="tel" required></label><label class="field"><span>Finalidade (opcional)</span><input type="text" id="q-fin" autocomplete="off"></label><p class="small" id="q-erro" style="color:var(--bad)" hidden></p><div class="actions"><button type="submit" class="btn pri">Enviar pedido</button></div></form></section><section class="sec"><h2>Os meus pedidos</h2>'+(lista?'<ul class="list">'+lista+'</ul>':'<p class="small muted">Ainda não fez nenhum pedido.</p>')+'</section>';
}
async function enviarPedido(){
  const e=$('#q-erro'),erro=t=>{e.textContent=t;e.hidden=false};
  const tipo=$('#q-tipo').value,valor=Number($('#q-val').value),prazo=parseInt($('#q-prazo').value,10),tel=$('#q-tel').value.trim(),fin=$('#q-fin').value.trim();
  if(!(valor>0))return erro('Indique o valor do pedido.');
  if(!(prazo>=1&&prazo<=60))return erro('O prazo deve ser entre 1 e 60 meses.');
  if(tel.length<6)return erro('Indique um telefone para contacto.');
  const ok=await tentar(async()=>{const r=await SB.from('pedidos').insert({tipo:tipo,valor:valor,prazo:prazo,telefone:tel,finalidade:fin});if(r.error)throw r.error},'Pedido enviado');
  if(ok)await carregarMeus();
}
function pedidosCli(){
  const ficha=o=>ADMPERF.find(p=>p.id===o)||{},tipo={concessao:'Concessão',aquisicao:'Aquisição'};
  const pend=ADMPED.filter(x=>x.estado==='analise'),dec=ADMPED.filter(x=>x.estado!=='analise').slice(0,10);
  let h='<section class="sec"><div class="sec-h"><h2>Pedidos de clientes</h2></div>';
  h+=pend.length?'<ul class="list">'+pend.map(x=>{const u=ficha(x.owner);return '<li class="card"><div class="row-top"><strong>'+esc(u.nome||'—')+'</strong><span class="pill warn">'+esc(tipo[x.tipo]||x.tipo)+'</span></div><p class="small muted">'+kz(x.valor)+' · '+esc(x.prazo)+' meses · tel. '+esc(x.telefone||'—')+'</p><p class="small muted">'+esc(u.email||'')+'</p>'+(x.finalidade?'<p class="small">'+esc(x.finalidade)+'</p>':'')+'<div class="actions"><button type="button" class="btn pri sm" data-action="ped-ok" data-id="'+esc(x.id)+'">Aprovar</button><button type="button" class="btn bad sm" data-action="ped-no" data-id="'+esc(x.id)+'">Recusar</button></div></li>'}).join('')+'</ul>':'<p class="small muted">Sem pedidos por analisar.</p>';
  if(dec.length)h+='<h3>Decididos</h3><ul class="list">'+dec.map(x=>'<li class="card"><div class="row-top"><strong>'+esc(ficha(x.owner).nome||'—')+'</strong><span class="pill'+(x.estado==='aprovado'?' good':'')+'">'+(x.estado==='aprovado'?'Aprovado':'Recusado')+'</span></div><p class="small muted">'+esc(tipo[x.tipo]||x.tipo)+' · '+kz(x.valor)+' · '+esc(x.prazo)+' meses</p></li>').join('')+'</ul>';
  return h+'</section>';
}
async function carregarAdmin(){
  ADMLOAD=true;
  const p=await SB.from('perfis').select('id,nome,papel,email'),r=await SB.from('registos').select('k,owner,col,data').in('col',['clientes','emprestimos']);
  ADMLOAD=false;
  if(p.error||r.error){ADM=false;render();return}
  ADMROWS=r.data;ADMPERF=p.data;
  {const q=await SB.from('pedidos').select('id,owner,tipo,valor,prazo,telefone,finalidade,estado,criado').order('criado',{ascending:false});ADMPED=q.error?[]:q.data}
  ADM=p.data.filter(u=>u.papel==='admin'||u.papel==='colaborador').map(u=>{const m=r.data.filter(x=>x.owner===u.id),em=m.filter(x=>x.col==='emprestimos');return{nome:u.nome,papel:u.papel,cli:m.filter(x=>x.col==='clientes').length,emp:em.length,ana:em.filter(x=>x.data.estado==='analise').length,cap:em.filter(x=>x.data.estado==='activo'||x.data.estado==='liquidado').reduce((t,x)=>t+num(x.data.capital),0)}});
  render();
}
function vAdmin(){
  if(ADM===false)return '<div class="card">Não foi possível carregar a equipa.</div>';
  if(ADM===undefined){if(!ADMLOAD)carregarAdmin();return carregando()}
  const pend=ADMROWS.filter(x=>x.col==='emprestimos'&&x.data.estado==='analise'),nome=o=>{const u=ADMPERF.find(p=>p.id===o);return u?u.nome:'—'};
  let h=pedidosCli()+'<section class="sec"><div class="sec-h"><h2>Pedidos por aprovar</h2><button type="button" class="btn sm" data-action="admin-rec">Actualizar</button></div>';
  h+=pend.length?'<ul class="list">'+pend.map(r=>{const cl=ADMROWS.find(x=>x.k==='clientes:'+r.data.clienteId),c=cl?cl.data:{},n=nDocs(c);return '<li><button type="button" class="row" data-action="adm-ver" data-k="'+esc(r.k)+'"><div class="row-top"><strong>'+esc(c.nome||'Cliente')+'</strong><span class="pill '+(n===4?'good':'warn')+'">'+n+'/4 fotos</span></div><span class="small muted">'+kz(r.data.capital)+' · colaborador: '+esc(nome(r.owner))+'</span></button></li>'}).join('')+'</ul>':'<p class="muted">Nenhum pedido à espera.</p>';
  h+='</section><section class="sec"><h2>Equipa</h2><ul class="list">'+ADM.map(u=>'<li class="card"><strong>'+esc(u.nome)+'</strong>'+(u.papel==='admin'?' <span class="pill acc">admin</span>':'')+'<p class="small muted">'+u.cli+' clientes · '+u.emp+' empréstimos ('+u.ana+' em análise) · capital '+kz(u.cap)+'</p></li>').join('')+'</ul></section>';
  return h;
}
function sheetAdm(k){
  const r=ADMROWS.find(x=>x.k===k);if(!r)return;
  const cl=ADMROWS.find(x=>x.k==='clientes:'+r.data.clienteId),c=cl?cl.data:{},d=c.docs||{};
  UI.admK=k;
  abrirSheet('Analisar pedido','<div class="sec"><p><strong>'+esc(c.nome||'Cliente')+'</strong><br><span class="muted small">BI '+esc(c.documento||'—')+' · tel. '+esc(c.telefone||'—')+' · pedido de '+kz(r.data.capital)+'</span></p><div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+DOCS.map(x=>'<div class="card"><p class="eyebrow">'+x[1]+'</p>'+(d[x[0]]?'<img data-path="'+esc(d[x[0]])+'" alt="'+x[1]+'" style="border-radius:8px;margin:8px 0">':'<p class="muted small" style="margin:8px 0">Em falta</p>')+'</div>').join('')+'</div><label class="small"><input type="checkbox" id="adm-ok"> Confirmo que verifiquei as fotos e a assinatura e que a pessoa existe.</label><div class="actions"><button type="button" class="btn pri" data-action="adm-aprovar">Aprovar</button><button type="button" class="btn bad" data-action="adm-recusar">Recusar</button></div></div>');
  carregarFotos();
}
async function decidirAdm(novo){
  const r=ADMROWS.find(x=>x.k===UI.admK);if(!r)return;
  const cl=ADMROWS.find(x=>x.k==='clientes:'+r.data.clienteId),d=(cl&&cl.data.docs)||{};
  if(novo==='activo'){
    if(DOCS.some(x=>!d[x[0]])){toast('Faltam fotos: não pode aprovar.',true);return}
    if(!$('#adm-ok').checked){toast('Marque a confirmação antes de aprovar.',true);return}
  }
  const ok=await tentar(async()=>{const nd=Object.assign({},r.data,{estado:novo}),u=await SB.from('registos').update({data:nd}).eq('k',r.k).select();if(u.error||!u.data||!u.data.length)throw u.error||{};},novo==='activo'?'Pedido aprovado':'Pedido recusado');
  if(ok){fecharSheet();ADM=undefined;render()}
}
/* ---------- eventos ---------- */
document.addEventListener('click',async ev=>{
  const nv=ev.target.closest('[data-nav]');
  if(nv){ir(nv.dataset.nav);return}
  const el=ev.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  switch(a){
    case 'fechar':fecharSheet();break;
    case 'confirmar':{const f=UI.confirmFn;if(f){const ok=await tentar(f);if(ok)fecharSheet()}break}
    case 'novo-cliente':fecharSheet();sheetCliente();break;
    case 'editar-cliente':sheetCliente(id);break;
    case 'apagar-cliente':{
      const n=S.emprestimos.filter(e=>e.clienteId===id).length;
      if(n){abrirSheet('Não é possível apagar','<div class="sec"><p>Este cliente tem '+n+(n===1?' empréstimo associado':' empréstimos associados')+'. Apague primeiro os empréstimos.</p><div class="actions"><button type="button" class="btn" data-action="fechar">Fechar</button></div></div>')}
      else confirmar('Apagar cliente','Apagar este cliente de forma definitiva?','Apagar cliente',async()=>{await apagar('clientes',id)});
      break}
    case 'novo-emp':fecharSheet();sheetEmprestimo();break;
    case 'editar-emp':sheetEmprestimo(id);break;
    case 'apagar-emp':confirmar('Apagar empréstimo','Apagar este empréstimo, o calendário e todos os pagamentos registados? Não se pode desfazer.','Apagar empréstimo',async()=>{await apagar('emprestimos',id);UI.view='emprestimos';UI.empId=null;render()});break;
    case 'abrir':UI.empId=id;UI.view='emprestimo';render();window.scrollTo(0,0);break;
    case 'filtro':UI.filtro=id;render();break;
    case 'filtro-aq':UI.filtroAq=id;render();break;
    case 'sim-conceder':fecharSheet();sheetEmprestimo(null,null,{capital:UI.sim.capital,prazo:UI.sim.prazo,taxa:UI.sim.taxa});break;
    case 'sim-obter':fecharSheet();sheetAquisicao(null,{capital:UI.sim.capital,prazo:UI.sim.prazo,taxa:UI.sim.taxa});break;
    case 'novo-aq':fecharSheet();sheetAquisicao();break;
    case 'editar-aq':sheetAquisicao(id);break;
    case 'abrir-aq':UI.aqId=id;UI.view='aquisicao';render();window.scrollTo(0,0);break;
    case 'apagar-aq':confirmar('Apagar crédito','Apagar este crédito, o calendário e todos os pagamentos registados? Não se pode desfazer.','Apagar crédito',async()=>{await apagar('aquisicoes',id);UI.view='aquisicoes';UI.aqId=null;render()});break;
    case 'pagar':sheetPagamento(id);break;
    case 'apagar-pag':{const pid=el.dataset.pid;confirmar('Apagar pagamento','Apagar este pagamento? As prestações voltam a ser recalculadas.','Apagar pagamento',async()=>{const e=reg(id);if(!e)return;const o=clonar(e);o.pagamentos=(o.pagamentos||[]).filter(p=>p.id!==pid);await salvar(colDe(id),o)});break}
    case 'aprovar':{const e=emp(id);if(e){const o=clonar(e);o.estado='activo';tentar(()=>salvar('emprestimos',o),'Empréstimo aprovado')}break}
    case 'recusar':{const e=emp(id);if(e){const o=clonar(e);o.estado='recusado';tentar(()=>salvar('emprestimos',o),'Empréstimo recusado')}break}
    case 'msg':{const e=emp(id),al=e&&alertaDe(e);if(al)copiar(mensagem(al));break}
    case 'exp-csv':exportar('csv');break;
    case 'exp-json':exportar('json');break;
    case 'termo':sheetTermo(id,el.dataset.eid);break;
    case 'termo-dl':baixarTermo(id,el.dataset.eid);break;
    case 'docs-cli':sheetDocs(id);break;
    case 'adm-ver':sheetAdm(el.dataset.k);break;
    case 'adm-aprovar':decidirAdm('activo');break;
    case 'adm-recusar':decidirAdm('recusado');break;
    case 'sair':SB.auth.signOut();break;
    case 'ver-reg':UI.reg=true;UI.msg='';render();break;
    case 'ver-login':UI.reg=false;UI.msg='';render();break;
    case 'ped-ok':case 'ped-no':{
      const novo=a==='ped-ok'?'aprovado':'recusado';
      const ok=await tentar(async()=>{const u=await SB.from('pedidos').update({estado:novo}).eq('id',id).select();if(u.error||!u.data||!u.data.length)throw u.error||{}},novo==='aprovado'?'Pedido aprovado':'Pedido recusado');
      if(ok){ADM=undefined;render()}
      break}
    case 'admin-rec':ADM=undefined;render();break;
    case 'imp-json':{const i=$('#f-imp');if(i)i.click();break}
    case 'exemplos':tentar(carregarExemplos,'Dados de exemplo carregados');break;
    case 'rem-exemplos':tentar(removerExemplos,'Dados de exemplo removidos');break;
  }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  const f=ev.target;
  if(f.id==='f-login')entrar();
  else if(f.id==='f-reg')registar();
  else if(f.id==='f-ped')enviarPedido();
  else if(f.id==='f-cliente')guardarCliente(f);
  else if(f.id==='f-emp')guardarEmp(f);
  else if(f.id==='f-aq')guardarAq(f);
  else if(f.id==='f-pag')guardarPagamento(f);
  else if(f.id==='f-defs'){
    const g=i=>document.getElementById(i);
    const cfg={negocio:g('s-negocio').value.trim(),intro:g('s-intro').value.trim(),banco:g('s-banco').value.trim(),titular:g('s-titular').value.trim(),iban:g('s-iban').value.trim(),express:g('s-express').value.trim(),taxa:Math.max(0,num(g('s-taxa').value)),prazo:Math.min(60,Math.max(1,Math.round(num(g('s-prazo').value)||10))),metodo:g('s-metodo').value,aviso:Math.min(60,Math.max(0,Math.round(num(g('s-aviso').value)))),esforcoMax:Math.min(100,Math.max(1,Math.round(num(g('s-esforco').value)||30))),aprovar:Math.min(100,Math.max(1,Math.round(num(g('s-aprovar').value)||70))),rever:Math.min(100,Math.max(0,Math.round(num(g('s-rever').value)||50)))};
    tentar(()=>salvarConfig(cfg),'Definições guardadas');
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='sim-cap'||t.id==='sim-prazo'||t.id==='sim-taxa')simInput(t);
  else if(t.id==='busca'){UI.busca=t.value;const l=$('#listaClientes');if(l)l.innerHTML=listaClientes()}
  else if(t.closest&&t.closest('#f-emp'))atualizarPrev();
  else if(t.closest&&t.closest('#f-aq'))atualizarPrevAq();
});
document.addEventListener('change',ev=>{if(ev.target.closest&&ev.target.closest('#f-emp'))atualizarPrev();else if(ev.target.closest&&ev.target.closest('#f-aq'))atualizarPrevAq()});
document.addEventListener('change',ev=>{const t=ev.target;if(t&&t.id==='f-imp'&&t.files&&t.files[0]){importar(t.files[0]);t.value=''}});
document.addEventListener('change',ev=>{const t=ev.target;if(t&&t.dataset&&t.dataset.doc&&t.files&&t.files[0])enviarFoto(t)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#sheet').hidden)fecharSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(SB&&SES)ligar();else render()}});

render();
iniciar();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
